[project]
name = "gra4157-big-data"
version = "0.1.0"
description = "GRA4157 Big Data Course Materials"
requires-python = ">=3.13"
dependencies = [
    "astroml>=1.0.2.post1",
    "beautifulsoup4>=4.14.2",
    "ipyleaflet>=0.20.0",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "notebook>=7.4.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "torch>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false  # This is an application/scripts project, not a library
